<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Kleea_2.png" />
    
    <!-- 🟢 1. Viewport optimisé PWA -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    
    <title>Kleea</title>
    <meta name="description" content="Kleea - Gestion de patrimoine privé, budgets et prévisions" />

    <!-- 🟢 2. CONFIGURATION PWA -->
    <meta name="theme-color" content="#0a0f1d" />

    <!-- 🍎 3. SUPPORT iOS & SAFARI -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kleea" />
    <link rel="apple-touch-icon" href="/Kleea_2.png" />

    <!-- 🟢 4. Nettoyage immédiat du vieux cache pollué + Application instantanée du vrai thème sombre (0 ms) -->
    <script>
      try {
        // Supprime définitivement la vieille clé qui forçait le gris-blanc
        localStorage.removeItem('mycash-theme');

        // Récupère le vrai thème actif
        const cached = localStorage.getItem('kleea-theme-cache');
        if (cached) {
          const t = JSON.parse(cached);
          if (t.bg_site) {
            document.documentElement.style.setProperty('--bg-site', t.bg_site);
            document.documentElement.style.backgroundColor = t.bg_site;
          }
          if (t.primary_color) document.documentElement.style.setProperty('--primary', t.primary_color);
          if (t.text_main) document.documentElement.style.setProperty('--text-main', t.text_main);
          if (t.radius) document.documentElement.style.setProperty('--radius', t.radius);
          if (t.glass_blur) document.documentElement.style.setProperty('--glass-blur', t.glass_blur);
          if (t.glass_bg) document.documentElement.style.setProperty('--glass-bg', t.glass_bg);
        }
      } catch (e) {}
    </script>

    <!-- 🟢 5. Empêche physiquement tout flash blanc (verrouillé sur var(--bg-site) avec repli sombre) -->
    <style>
      html, body, #root {
        background-color: var(--bg-site, #0a0f1d) !important;
        color: var(--text-main, #ffffff);
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
