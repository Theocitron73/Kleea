# Suivi des changements de structure de la base. À lancer depuis la racine du dépôt.
# La base visée vient de DATABASE_URL : voir backend/migrations/README.md avant toute commande.
[alembic]
script_location = backend/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
